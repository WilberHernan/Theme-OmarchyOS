source = ~/.config/omarchy/current/theme/hyprlock.conf

general {
    ignore_empty_input = true
    hide_cursor = true
}

background {
    monitor =
    color = $color
    path = ~/.config/omarchy/current/background
    blur_passes = 0
}

animations {
    enabled = true
    bezier = apple, 0.25, 0.1, 0.25, 1
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    animation = fadeIn,  1, 6, apple
    animation = fadeOut, 1, 6, apple
    animation = inputFieldDots,   1, 3, easeOutQuint
    animation = inputFieldColors, 1, 3, easeOutQuint
    animation = inputFieldFade,   1, 3, easeOutQuint
}

# Password — invisible, only dots appear while typing
input-field {
    monitor =
    size = 300, 18
    position = 0, -120
    halign = center
    valign = center

    outline_thickness = 0
    inner_color = rgba(0, 0, 0, 0)
    outer_color = rgba(0, 0, 0, 0)
    font_family = Inter
    font_color = rgb(F9F9F9)
    dots_size = 0.35
    dots_spacing = 0.4
    dots_center = true
    dots_rounding = -1
    placeholder_text =
    check_text =
    fail_text =
    fade_on_empty = true
    fade_timeout = 500
    rounding = 0
    shadow_passes = 0

    check_color = rgba(0, 0, 0, 0)
    fail_color = rgba(0, 0, 0, 0)
}

auth {
    fingerprint:enabled = false
}

source = ~/.local/state/omarchy/toggles/hyprlock.conf
